<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>allai settings</title>
  <style>
    body { margin: 0; padding: 20px; min-width: 380px; background: #141414; color: #ececec;
           font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
    label { display: block; font-size: 11px; color: #8a8a8a; text-transform: uppercase; letter-spacing: 0.02em; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; font: inherit; color: #ececec; background: #1c1c1c;
            border: 1px solid #2c2c2c; border-radius: 8px; padding: 7px 9px; outline: none; }
    input:focus { border-color: #6b6b6b; }
    button { margin-top: 10px; font: inherit; font-weight: 600; border-radius: 8px; padding: 7px 14px;
             background: #ececec; color: #111; border: 1px solid #ececec; cursor: pointer; }
    p { color: #8a8a8a; margin: 8px 0 0; }
    #status { margin-top: 12px; min-height: 1.4em; }
    .ok { color: #7fd48a; } .err { color: #ff7a59; }
    code { font: 12px ui-monospace, Menlo, monospace; color: #c8c8c8; }
  </style>
</head>
<body>
  <label for="receiver">Receiver</label>
  <input id="receiver" type="url" placeholder="http://127.0.0.1:7711" />
  <p>Where <code>npm run inbox</code> listens. Change the port in the repo's <code>.env</code> (<code>ALLAI_INBOX_PORT</code>) and here.</p>
  <button id="save">Save and test</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
